<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>个性化工作站 · 界面设计验收稿（M1 骨架）</title>
<style>
/* ── 配色：与 WPF 的 Light.xaml / Dark.xaml 一一对应 ───────────────── */
:root{
  --window-bg:#F4F5F7; --panel:#FFFFFF; --nav-bg:#FAFBFC; --topbar:#FFFFFF; --status:#F0F2F5;
  --border:#E5E7EB; --separator:#ECEEF1; --hover:#EEF1F5; --input:#FFFFFF;
  --text:#1F2329; --text2:#5A6270; --muted:#98A0AC;
  --accent:#2F6FED; --accent-hover:#1F5AD6; --accent-soft:#E8F0FE; --on-accent:#FFFFFF;
  --accent-ghost:rgba(47,111,237,.14);
  --success:#1EA672; --success-soft:#E4F5EE; --warning:#D98A16; --warning-soft:#FCF2E2;
  --danger:#DE4B4B; --danger-soft:#FCEBEB; --neutral-soft:#EEF0F3;
  --shadow:0 6px 20px rgba(15,23,42,.10);
}
html[data-theme="dark"]{
  --window-bg:#141519; --panel:#1E1F25; --nav-bg:#191A1F; --topbar:#1E1F25; --status:#191A1F;
  --border:#2E3038; --separator:#2A2C33; --hover:#272930; --input:#26272E;
  --text:#E6E8EC; --text2:#A8AEBA; --muted:#767D8A;
  --accent:#4F8BFF; --accent-hover:#6BA0FF; --accent-soft:#22304A; --on-accent:#FFFFFF;
  --accent-ghost:rgba(79,139,255,.20);
  --success:#3FBF87; --success-soft:#1C3A2E; --warning:#E9B45C; --warning-soft:#3A2F1A;
  --danger:#E56767; --danger-soft:#3A2323; --neutral-soft:#26272E;
  --shadow:0 6px 20px rgba(0,0,0,.45);
}

*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{
  font-family:"Microsoft YaHei UI","Microsoft YaHei","Segoe UI",sans-serif;
  font-size:13px; color:var(--text); background:var(--window-bg);
  -webkit-font-smoothing:antialiased; overflow:hidden;
}
.glyph{font-family:"Segoe MDL2 Assets","Segoe Fluent Icons",sans-serif;line-height:1;display:inline-block;}
button{font-family:inherit;font-size:13px;color:inherit;background:none;border:0;padding:0;cursor:pointer;}

/* ── 整体：顶栏 / 主体 / 状态栏，自上而下三段 ─────────────────────── */
.app{height:100%;display:flex;flex-direction:column;}

/* ① 顶部栏（高 52） */
.topbar{
  height:52px;flex:0 0 52px;background:var(--topbar);border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 12px;gap:4px;
}
.topbar .brand{font-size:15px;font-weight:600;margin-left:4px;white-space:nowrap;}
.topbar .spacer{flex:1;}
.topbar .today{color:var(--text2);margin-right:16px;white-space:nowrap;}
.iconbtn{
  width:32px;height:32px;border-radius:6px;color:var(--text2);
  display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;
}
.iconbtn:hover{background:var(--hover);color:var(--text);}
.iconbtn.hidden{display:none;}
.savewrap{display:flex;align-items:center;margin-right:6px;}
.save-dot{font-size:10px;color:var(--success);margin-right:6px;}
.save-dot.err{color:var(--danger);}
#saveStatus{font-size:12px;color:var(--text2);margin-right:14px;white-space:nowrap;}

/* ② 主体 */
.body{flex:1;display:flex;min-height:0;}

/* 左侧导航：宽 236 / 折叠 58 / 隐藏 0 */
.nav{
  position:relative;width:236px;flex:0 0 236px;background:var(--nav-bg);border-right:1px solid var(--border);
  display:flex;flex-direction:column;min-height:0;overflow:hidden;
  transition:width .16s ease, flex-basis .16s ease;
}
.nav.hidden{border-right:0;}
.nav.resizing{transition:none;}
/* 右侧边界：拖动改变导航栏宽度 */
.nav-resizer{position:absolute;top:0;right:0;bottom:0;width:7px;cursor:col-resize;z-index:6;}
.nav-resizer::after{content:"";position:absolute;top:0;bottom:0;right:3px;width:2px;background:transparent;}
.nav-resizer:hover::after,.nav.resizing .nav-resizer::after{background:var(--accent);}
.nav.collapsed .nav-resizer,.nav.hidden .nav-resizer{display:none;}
body.resizing{user-select:none;cursor:col-resize;}
.nav-scroll{flex:1;overflow-y:auto;padding:6px 0;}
.nav-pinned{border-top:1px solid var(--border);padding:6px 0 8px;flex:0 0 auto;}

.group-head{
  display:flex;align-items:center;width:100%;padding:12px 10px 6px 14px;color:var(--muted);
}
.group-head:hover{color:var(--text2);}
.group-head .glyph{font-size:10px;margin-right:8px;}
.group-head .gtitle{font-size:12px;}
.group-items{overflow:hidden;}
.group.collapsed .group-items{display:none;}
.nav.collapsed .group-head{display:none;}

.nav-item{
  display:flex;align-items:center;height:34px;margin:1px 8px;padding:0 10px;border-radius:6px;
  color:var(--text2);width:calc(100% - 16px);
}
.nav-item:hover{background:var(--hover);color:var(--text);}
.nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600;}
.nav-item .glyph{font-size:15px;width:22px;text-align:center;flex:0 0 22px;}
.nav-item .label{font-size:13px;margin-left:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.nav.collapsed .nav-item{justify-content:center;padding:0;}
.nav.collapsed .nav-item .label{display:none;}

/* 「首页总览」这一行：模块与折叠按钮放在同一个小框架里 */
.nav-home-row{
  display:flex;align-items:center;gap:8px;margin:2px 8px 4px;padding:2px;
  border:1px solid var(--border);border-radius:8px;background:var(--panel);
}
.nav-home-row .nav-item{margin:0;width:auto;flex:1;min-width:0;padding:0 10px;}
.nav-home-row .nav-collapse-btn{margin-left:auto;}
.nav-home-row:hover{background:var(--hover);}
.nav-home-row:hover .nav-item,.nav-home-row.active .nav-item{background:transparent;}
/* 选中时蓝色底色铺满整个小框架（把折叠按钮也包在里面），按钮用主色画，在底色上看得清 */
.nav-home-row.active{border-color:var(--accent-soft);background:var(--accent-soft);}
.nav-home-row.active .nav-item{color:var(--accent);font-weight:600;}
.nav-collapse-btn{
  width:26px;height:26px;border-radius:6px;color:var(--text2);flex:0 0 auto;
  display:inline-flex;align-items:center;justify-content:center;
}
.nav-collapse-btn:hover{background:var(--hover);color:var(--text);}
.nav-home-row.active .nav-collapse-btn{color:var(--accent);}
.nav-home-row.active .nav-collapse-btn:hover{background:var(--accent-ghost);color:var(--accent-hover);}
.nav-collapse-btn .glyph{font-size:11px;}
/* 折叠成图标条后：这一行不再显示「首页总览」，只留折叠按钮 */
.nav.collapsed .nav-home-row{
  margin:2px 10px 4px;padding:0;border-color:transparent;background:transparent;justify-content:center;
}
.nav.collapsed .nav-home-row .nav-item{display:none;}
.nav.collapsed .nav-home-row .nav-collapse-btn{margin-left:0;color:var(--text2);}
.nav.collapsed .nav-home-row .nav-collapse-btn:hover{background:var(--hover);color:var(--text);}

/* 右侧内容区 */
.main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;}
.content-head{background:var(--topbar);border-bottom:1px solid var(--border);flex:0 0 auto;}
.title-row{display:flex;align-items:baseline;padding:14px 24px 0;}
.title-row h1{margin:0;font-size:18px;font-weight:600;}
.title-row .summary{margin-left:12px;font-size:12px;color:var(--muted);}
.tabs{display:flex;margin:10px 24px 0;flex-wrap:wrap;}
.tab{
  position:relative;padding:10px 12px 9px;color:var(--text2);font-size:13px;border-radius:6px 6px 0 0;
}
.tab:hover{color:var(--text);}
.tab.active{color:var(--accent);font-weight:600;}
.tab.active::after{
  content:"";position:absolute;left:10px;right:10px;bottom:0;height:2px;background:var(--accent);
}
.content-body{flex:1;overflow-y:auto;padding:20px 24px 24px;background:var(--window-bg);}

/* ── 通用控件 ─────────────────────────────────────────────────────── */
.card{
  background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:16px;
  max-width:880px;
}
.card.wide{max-width:1000px;}
.card + .card{margin-top:14px;}
.section-title{font-size:14px;font-weight:600;margin:0 0 8px;}
.muted{color:var(--text2);font-size:12px;}
.dim{color:var(--muted);font-size:12px;}
.hair{height:1px;background:var(--separator);margin:12px 0;}
.row{display:flex;align-items:center;gap:8px;}
.row.between{justify-content:space-between;}
.bullets{margin:0;padding:0;list-style:none;}
.bullets li{display:flex;gap:8px;margin-bottom:7px;color:var(--text2);line-height:21px;}
.bullets li .dot{color:var(--muted);flex:0 0 auto;}

.btn{
  height:32px;padding:0 14px;border-radius:6px;font-size:13px;
  display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;
}
.btn-primary{background:var(--accent);color:var(--on-accent);}
.btn-primary:hover{background:var(--accent-hover);}
.btn-secondary{background:var(--panel);color:var(--text);border:1px solid var(--border);}
.btn-secondary:hover{background:var(--hover);}
.btn-danger{background:var(--danger-soft);color:var(--danger);border:1px solid var(--danger-soft);}
.btn-danger:hover{border-color:var(--danger);}
.btn.small{height:28px;padding:0 12px;}

.checkline{display:flex;align-items:center;gap:8px;margin:8px 0;cursor:pointer;user-select:none;}
input[type=checkbox]{appearance:none;width:16px;height:16px;border:1px solid var(--border);
  border-radius:4px;background:var(--input);position:relative;cursor:pointer;margin:0;flex:0 0 16px;}
input[type=checkbox]:checked{background:var(--accent);border-color:var(--accent);}
input[type=checkbox]:checked::after{
  content:"";position:absolute;left:4.5px;top:1.5px;width:4px;height:8px;
  border:solid var(--on-accent);border-width:0 2px 2px 0;transform:rotate(45deg);}

/* 占位页：图标 + 标题 + 阶段 + 说明 + 计划内容 */
.ph-head{display:flex;align-items:center;}
.ph-icon{
  width:36px;height:36px;border-radius:8px;background:var(--accent-soft);color:var(--accent);
  display:flex;align-items:center;justify-content:center;font-size:16px;flex:0 0 36px;
}
.ph-title{font-size:15px;font-weight:600;}
.ph-note{margin:16px 0 0;color:var(--text2);line-height:21px;}

/* ③ 状态栏 */
.statusbar{
  height:auto;flex:0 0 auto;background:var(--status);border-top:1px solid var(--border);
  padding:5px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;
}
.statusbar .left{display:flex;align-items:center;gap:6px;min-width:0;}
.statusbar .glyph{font-size:12px;color:var(--muted);}
.statusbar .link{font-size:12px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.statusbar .link:hover{color:var(--accent);text-decoration:underline;}
.statusbar .right{display:flex;align-items:center;gap:8px;white-space:nowrap;font-size:12px;color:var(--muted);}

/* 备份列表 */
.bk-row{display:grid;grid-template-columns:150px 1fr auto auto;gap:12px;align-items:center;
  padding:8px 0;border-bottom:1px solid var(--separator);font-size:13px;}
.bk-row:last-child{border-bottom:0;}
.bk-empty{color:var(--muted);font-size:12px;padding:10px 0;}

/* ── 验收清单抽屉 ─────────────────────────────────────────────────── */
#checkPanel{
  position:fixed;top:0;right:0;bottom:0;width:368px;background:var(--panel);
  border-left:1px solid var(--border);box-shadow:var(--shadow);
  display:flex;flex-direction:column;transform:translateX(100%);transition:transform .18s ease;z-index:20;
}
#checkPanel.open{transform:none;}
#checkPanel header{display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px;border-bottom:1px solid var(--border);}
#checkPanel h2{margin:0;font-size:15px;font-weight:600;}
#checkPanel .cp-body{flex:1;overflow-y:auto;padding:8px 16px 16px;}
#checkPanel .cp-foot{padding:10px 16px;border-top:1px solid var(--border);display:flex;
  align-items:center;justify-content:space-between;gap:10px;}
.cp-group{margin-top:14px;}
.cp-group h3{margin:0 0 6px;font-size:12px;color:var(--muted);font-weight:600;}
.cp-item{display:flex;gap:8px;align-items:flex-start;padding:6px 0;cursor:pointer;line-height:19px;}
.cp-item span{color:var(--text2);}
.cp-item.done span{color:var(--muted);text-decoration:line-through;}
.progress{height:6px;border-radius:3px;background:var(--neutral-soft);overflow:hidden;flex:1;}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .15s ease;}

/* 首次打开的小提示 */
#hint{
  position:fixed;right:18px;bottom:46px;background:var(--panel);border:1px solid var(--border);
  border-radius:8px;box-shadow:var(--shadow);padding:10px 12px;font-size:12px;color:var(--text2);
  display:flex;align-items:center;gap:10px;z-index:15;
}
#hint .glyph{color:var(--accent);font-size:14px;}
#hint .x{color:var(--muted);font-size:14px;}
#hint .x:hover{color:var(--text);}
</style>
</head>
<body>
<div class="app">

  <!-- ① 顶部栏 -->
  <header class="topbar">
    <button class="iconbtn" id="btnNavVisible" title="显示 / 隐藏左侧导航栏"><span class="glyph">&#xE700;</span></button>
    <span class="brand">个性化工作站</span>
    <span class="spacer"></span>
    <span class="today" id="todayText"></span>
    <span class="savewrap">
      <span class="glyph save-dot" id="saveDot">&#xE73E;</span>
      <span id="saveStatus">已保存 --:--:--</span>
    </span>
    <button class="iconbtn" id="btnTheme" title="主题：浅色（点击切换）"><span class="glyph">&#xE706;</span></button>

    <button class="iconbtn" id="btnCheck" title="验收清单"><span class="glyph">&#xE9D5;</span></button>
  </header>
  <!-- ② 主体 -->
  <div class="body">
    <aside class="nav" id="nav">
      <div class="nav-scroll" id="navScroll"></div>
      <div class="nav-pinned" id="navPinned"></div>
      <div class="nav-resizer" id="navResizer" title="拖动改变导航栏宽度（双击恢复默认）"></div>
    </aside>

    <main class="main">
      <div class="content-head">
        <div class="title-row">
          <h1 id="moduleTitle">首页总览</h1>
          <span class="summary" id="moduleSummary"></span>
        </div>
        <div class="tabs" id="tabs"></div>
      </div>
      <div class="content-body" id="contentBody"></div>
    </main>
  </div>

  <!-- ③ 状态栏 -->
  <footer class="statusbar">
    <div class="left">
      <span class="glyph">&#xE8B7;</span>
      <span class="link" id="dataFileText" title="点击打开数据文件夹"></span>
    </div>
    <div class="right">
      <span id="backupCountText">暂无备份</span>
      <span>·</span>
      <span id="saveStatus2">已保存 --:--:--</span>
      <span>·</span>
      <span>版本 1.0.0</span>
    </div>
  </footer>
</div>

<!-- 验收清单抽屉 -->
<aside id="checkPanel">
  <header>
    <h2>验收清单</h2>
    <button class="iconbtn" id="btnCheckClose" title="关闭"><span class="glyph">&#xE711;</span></button>
  </header>
  <div class="cp-body" id="cpBody"></div>
  <div class="cp-foot">
    <div class="progress"><i id="cpBar"></i></div>
    <span class="dim" id="cpCount">0 / 0</span>
    <button class="btn btn-secondary small" id="cpReset">清空勾选</button>
  </div>
</aside>

<div id="hint">
  <span class="glyph">&#xE946;</span>
  <span>这是 M1 骨架的界面验收稿：点左侧模块切页，「首页总览」右侧的 ‹ 可折叠导航，导航右边界可拖动改宽，右上角可切主题。右上角「验收清单」可逐项核对。</span>
  <button class="x" id="hintClose" title="不再显示"><span class="glyph">&#xE711;</span></button>
</div>
<script>
/* ── 左侧导航分组（与 NavModels / MainViewModel 一致） ─────────────── */
var GROUPS = [
  { key:"top",  title:"" },
  { key:"work", title:"工作事务" },
  { key:"create", title:"内容创作" },
  { key:"life", title:"生活健康" }
];

/* ── 模块与详细标签页（图标为 Segoe MDL2 Assets 字形，与程序一致） ── */
var MODULES = [
  { key:"home", group:"top", title:"首页总览", icon:"\uE80F", summary:"今日计划、快速备忘与各模块摘要",
    tabs:[{ key:"home-overview", title:"今日总览", page:{ title:"今日总览", stage:"计划在 M2 阶段实现",
      note:"打开程序第一眼看到的地方：今天要做什么、有什么要跟进、各模块的关键摘要。",

  { key:"plan", group:"work", title:"今日计划", icon:"\uE787", summary:"当天要做的事、优先级与顺延",
    tabs:[
      { key:"plan-tasks", title:"任务清单", page:{ title:"任务清单", stage:"计划在 M2 阶段实现",
        note:"当天要做的事，按优先级排好，做完打勾，做不完顺延到明天。",
        bullets:["日期切换：前一天 / 今天 / 后一天，可补录历史","任务项：优先级色条、标题、模块标签、拖动排序",
          "行内操作：双击改名、勾选完成、顺延到明天、复制、删除","底部操作：把未完成项批量顺延到明天"]}},
      { key:"plan-calendar", title:"月历与完成率", page:{ title:"月历与完成率", stage:"计划在 M2 阶段实现",

  { key:"dev", group:"work", title:"开发工作", icon:"\uE943", summary:"项目、待办与缺陷、代码片段",
    tabs:[
      { key:"dev-projects", title:"项目与待办", page:{ title:"项目与待办", stage:"计划在 M3 阶段实现",
        note:"左边是项目列表，右边是该项目的待办、缺陷和想法。",
        bullets:["项目卡片：名称、状态、进度条（按待办完成比自动算）、截止日期",
          "左侧项目列表可增删改，截止日期临近自动高亮",
          "待办项：类型（任务 / 缺陷 / 想法）、优先级、状态、完成时间","筛选：只看未完成、只看缺陷、按优先级排序"]}},
      { key:"dev-snippets", title:"代码片段", page:{ title:"代码片段", stage:"计划在 M3 阶段实现",
        note:"随手存下来的代码片段，用的时候一键复制走。",
        bullets:["片段：标题、语言、代码正文、说明","代码用等宽字体显示，保留缩进","一键复制到剪贴板",

      { key:"dev-notes", title:"项目笔记", page:{ title:"项目笔记", stage:"计划在 M3 阶段实现",
        note:"每个项目的技术决定、踩坑记录和待验证的想法。",
        bullets:["按项目分组的多行笔记，保留换行","适合记：技术选型理由、环境配置、待验证方案",
          "顶部显示项目当前状态与未完成缺陷数"]}}]},

  { key:"consulting", group:"work", title:"咨询工作", icon:"\uE77B", summary:"客户、项目、沟通记录与时长费用",
    tabs:[

function findModule(key){ return MODULES.filter(function(m){ return m.key===key; })[0]; }
function currentModule(){ return findModule(state.moduleKey); }
function currentTab(){
  var m = currentModule();
  return m.tabs.filter(function(t){ return t.key===state.tabKey; })[0] || m.tabs[0];
}
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function nowText(){
  var d = new Date(), p = function(n){ return (n<10?"0":"")+n; };
  return p(d.getHours())+":"+p(d.getMinutes())+":"+p(d.getSeconds());
}
function todayText(){
  var d = new Date(), p = function(n){ return (n<10?"0":"")+n; };
  var week = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"][d.getDay()];
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+" "+week;
}

/* ── 左侧导航 ─────────────────────────────────────────────────────── */
function renderNav(){
  var scroll = document.getElementById("navScroll");
  var html = "";
  GROUPS.forEach(function(g){
    var items = MODULES.filter(function(m){ return m.group===g.key && !m.pinned; });
    if(!items.length) return;
    var collapsed = !!state.collapsed[g.key];
    html += '<div class="group'+(collapsed?" collapsed":"")+'">';
    if(g.title){
      html += '<button class="group-head" data-group="'+g.key+'">'+
              '<span class="glyph">'+(collapsed?"\uE76C":"\uE70D")+'</span>'+
              '<span class="gtitle">'+esc(g.title)+'</span></button>';
    }
    html += '<div class="group-items">';
    items.forEach(function(m){
      var item = '<button class="nav-item'+(m.key===state.moduleKey?" active":"")+'" data-module="'+m.key+'" title="'+esc(m.title)+'">'+
                 '<span class="glyph">'+m.icon+'</span><span class="label">'+esc(m.title)+'</span></button>';
      if(g.title){
        html += item;
      } else {
        /* 置顶的「首页总览」：模块与折叠按钮同在一个小框架里 */
        html += '<div class="nav-home-row' + (m.key === state.moduleKey ? ' active' : '') +
                '" data-module="' + m.key + '">' + item +
                '<button class="nav-collapse-btn" title="折叠 / 展开导航栏">' +
                '<span class="glyph">' + (state.navCollapsed ? "\uE76C" : "\uE76B") + '</span></button></div>';
      }
    });
    html += '</div></div>';
  });
  scroll.innerHTML = html;

  var pinned = MODULES.filter(function(m){ return m.pinned; })[0];
  document.getElementById("navPinned").innerHTML =
    '<button class="nav-item'+(pinned.key===state.moduleKey?" active":"")+'" data-module="'+pinned.key+'" title="'+esc(pinned.title)+'">'+
    '<span class="glyph">'+pinned.icon+'</span><span class="label">'+esc(pinned.title)+'</span></button>';
}

function renderHead(){
  var m = currentModule();
  document.getElementById("moduleTitle").textContent = m.title;
  document.getElementById("moduleSummary").textContent = m.summary;
  var tabs = document.getElementById("tabs");
  if(m.tabs.length < 2){ tabs.innerHTML = ""; return; }
  var tab = currentTab();
  tabs.innerHTML = m.tabs.map(function(t){
    return '<button class="tab'+(t.key===tab.key?" active":"")+'" data-tab="'+t.key+'">'+esc(t.title)+'</button>';
  }).join("");
}

      '<div class="dim" style="margin-top:8px;line-height:19px">快捷键：Ctrl+1~9 切换模块 · Ctrl+S 立即保存 · F5 重新加载数据文件</div>'+
    '</div>'+
    '<div class="card wide">'+
      '<h2 class="section-title" style="color:var(--danger)">危险操作</h2>'+
      '<div class="dim" style="line-height:19px">清空所有数据会删除全部模块的记录（客户、项目、沟通记录、内容排期、训练、饮食、娱乐等），只留下一个空的数据文件。清空之前会自动备份一份，万一清错了可以从上面的备份列表里恢复。</div>'+
      '<div style="margin-top:14px"><button class="btn btn-danger">清空所有数据</button></div>'+
    '</div>';
}

function renderContent(){
  var tab = currentTab();
  var body = document.getElementById("contentBody");
  if(tab.settings==="data") body.innerHTML = settingsDataHtml();
  else if(tab.settings==="appearance") body.innerHTML = settingsAppearanceHtml();
  else if(tab.settings==="about") body.innerHTML = settingsAboutHtml();
  else body.innerHTML = placeholderHtml(tab.page);
  body.scrollTop = 0;
  bindContentEvents();
}
/* ── 顶部栏 / 状态栏 / 主题 / 导航形态 ───────────────────────────── */
function effectiveTheme(){
  if(state.theme!=="system") return state.theme;
  return (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
}
function applyTheme(){
  document.documentElement.setAttribute("data-theme", effectiveTheme());
  var label = state.theme==="light" ? "浅色" : (state.theme==="dark" ? "深色" : "跟随系统");
  document.getElementById("btnTheme").title = "主题：" + label + "（点击切换）";
}
function applyNav(){
  var nav = document.getElementById("nav");
  nav.classList.toggle("collapsed", state.navCollapsed);
  nav.classList.toggle("hidden", !state.navVisible);
  var w = !state.navVisible ? 0 : (state.navCollapsed ? 58 : state.navWidth);
  nav.style.width = w + "px";
  nav.style.flexBasis = w + "px";
}
function renderStatus(){
  document.getElementById("todayText").textContent = todayText();
  document.getElementById("dataFileText").textContent = "数据文件：" + DATA_FILE;
  document.getElementById("backupCountText").textContent = state.backupCountText;
  document.getElementById("saveStatus").textContent = (state.saveError?"保存失败：":"已保存 ") + state.saveText;
  document.getElementById("saveStatus2").textContent = (state.saveError?"保存失败：":"已保存 ") + state.saveText;
  document.getElementById("saveDot").classList.toggle("err", state.saveError);
}
/* 编辑即保存：任何操作后刷新保存时间（与程序里「500ms 防抖写盘 + 状态栏显示时间」一致） */
function touchSave(){
  state.saveText = nowText();
  state.saveError = false;
  renderStatus();
}

/* ── 交互 ─────────────────────────────────────────────────────────── */
function selectModule(key){
  var m = findModule(key); if(!m) return;
  state.moduleKey = key;
  state.tabKey = m.tabs[0].key;
  renderAll();
  touchSave();
}
function selectTab(key){
  state.tabKey = key;
  renderHead(); renderContent();
  touchSave();
}
function renderAll(){ renderNav(); renderHead(); renderContent(); applyNav(); applyTheme(); renderStatus(); }

function bindContentEvents(){
  var body = document.getElementById("contentBody");
  body.querySelectorAll("[data-theme-set]").forEach(function(b){
    b.addEventListener("click", function(){ state.theme = b.getAttribute("data-theme-set"); applyTheme(); renderContent(); touchSave(); });
  });
  var cbVis = document.getElementById("cbNavVisible");
  if(cbVis) cbVis.addEventListener("change", function(){ state.navVisible = cbVis.checked; applyNav(); touchSave(); });
  var cbCol = document.getElementById("cbNavCollapsed");
  if(cbCol) cbCol.addEventListener("change", function(){ state.navCollapsed = cbCol.checked; applyNav(); touchSave(); });
  var bk = document.getElementById("btnBackupNow");
  if(bk) bk.addEventListener("click", function(){
    state.backupCountText = "1 份备份";
    renderStatus(); renderContent(); touchSave();
  });
}

document.getElementById("navScroll").addEventListener("click", function(e){
  var cb = e.target.closest(".nav-collapse-btn");
  if(cb){ state.navCollapsed = !state.navCollapsed; renderNav(); applyNav(); touchSave(); return; }
  var g = e.target.closest(".group-head");
  if(g){ var key = g.getAttribute("data-group"); state.collapsed[key] = !state.collapsed[key]; renderNav(); return; }
  var item = e.target.closest(".nav-item");
  if(item){ selectModule(item.getAttribute("data-module")); return; }
  /* 小框架里折叠按钮左边的空白也当作「首页总览」的点击区域 */
  var row = e.target.closest(".nav-home-row");
  if(row) selectModule(row.getAttribute("data-module"));
});
document.getElementById("navPinned").addEventListener("click", function(e){
  var item = e.target.closest(".nav-item");
  if(item) selectModule(item.getAttribute("data-module"));
});
document.getElementById("tabs").addEventListener("click", function(e){
  var tab = e.target.closest(".tab");
  if(tab) selectTab(tab.getAttribute("data-tab"));
});
document.getElementById("btnNavVisible").addEventListener("click", function(){
  state.navVisible = !state.navVisible; applyNav(); touchSave();
});
/* 拖动导航栏右边界改变宽度（180 ~ 420px），双击恢复默认；折叠或隐藏时不生效 */
var NAV_MIN = 180, NAV_MAX = 420, NAV_DEFAULT = 236;
(function(){
  var resizer = document.getElementById("navResizer");
  if(!resizer) return;
  resizer.addEventListener("mousedown", function(e){
    if(!state.navVisible || state.navCollapsed) return;
    e.preventDefault();
    var startX = e.clientX, startW = state.navWidth;
    var nav = document.getElementById("nav");
    nav.classList.add("resizing");
    document.body.classList.add("resizing");
    function onMove(ev){
      state.navWidth = Math.round(Math.min(NAV_MAX, Math.max(NAV_MIN, startW + ev.clientX - startX)));
      applyNav();
    }
    function onUp(){
      nav.classList.remove("resizing");
      document.body.classList.remove("resizing");
      document.removeEventListener("mousemove", onMove);
      document.removeEventListener("mouseup", onUp);
      touchSave();
    }
    document.addEventListener("mousemove", onMove);
    document.addEventListener("mouseup", onUp);
  });
  resizer.addEventListener("dblclick", function(){
    state.navWidth = NAV_DEFAULT; applyNav(); touchSave();
  });
})();
document.getElementById("btnTheme").addEventListener("click", function(){
  state.theme = state.theme==="light" ? "dark" : (state.theme==="dark" ? "system" : "light");
  applyTheme(); touchSave();
});
if(window.matchMedia){
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function(){
    if(state.theme==="system") applyTheme();
  });
}
document.addEventListener("keydown", function(e){
  if(e.ctrlKey && e.key>="1" && e.key<="9"){
    var m = MODULES[parseInt(e.key,10)-1];
    if(m){ e.preventDefault(); selectModule(m.key); }
  }
  if(e.key==="Escape") document.getElementById("checkPanel").classList.remove("open");
});
/* ── 验收清单抽屉 ─────────────────────────────────────────────────── */
var checkState = [];
CHECK.forEach(function(g){ g.items.forEach(function(){ checkState.push(false); }); });

function renderCheck(){
  var idx = 0, html = "";
  CHECK.forEach(function(g){
    html += '<div class="cp-group"><h3>'+esc(g.title)+'</h3>';
    g.items.forEach(function(text){
      var i = idx++;
      html += '<label class="cp-item'+(checkState[i]?" done":"")+'" data-i="'+i+'">'+
              '<input type="checkbox"'+(checkState[i]?" checked":"")+'>'+
              '<span>'+esc(text)+'</span></label>';
    });
    html += '</div>';
  });
  document.getElementById("cpBody").innerHTML = html;
  var done = checkState.filter(Boolean).length;
  document.getElementById("cpCount").textContent = done + " / " + checkState.length;
  document.getElementById("cpBar").style.width = (checkState.length? Math.round(done/checkState.length*100):0) + "%";
}
document.getElementById("cpBody").addEventListener("change", function(e){
  var item = e.target.closest(".cp-item"); if(!item) return;
  checkState[parseInt(item.getAttribute("data-i"),10)] = e.target.checked;
  renderCheck();
});
document.getElementById("cpBody").addEventListener("click", function(e){
  var item = e.target.closest(".cp-item"); if(!item || e.target.tagName==="INPUT") return;
  checkState[parseInt(item.getAttribute("data-i"),10)] = !checkState[parseInt(item.getAttribute("data-i"),10)];
  renderCheck();
});
document.getElementById("btnCheck").addEventListener("click", function(){
  document.getElementById("checkPanel").classList.add("open");
  document.getElementById("hint").style.display = "none";
});
document.getElementById("btnCheckClose").addEventListener("click", function(){
  document.getElementById("checkPanel").classList.remove("open");
});
document.getElementById("cpReset").addEventListener("click", function(){
  checkState = checkState.map(function(){ return false; }); renderCheck();
});
document.getElementById("hintClose").addEventListener("click", function(){
  document.getElementById("hint").style.display = "none";
});

/* ── 启动 ─────────────────────────────────────────────────────────── */
state.tabKey = "home-overview";
renderAll();
renderCheck();
</script>
</body>
</html>
